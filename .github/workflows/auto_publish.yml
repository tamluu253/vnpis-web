name: VNPIS 52-Week Auto-Publish & Email Alert (Cloud Cron)

on:
  schedule:
    # Tự động chạy lúc 08:00 AM (giờ Hà Nội) các ngày Thứ 2, Thứ 4, Thứ 6 hàng tuần
    - cron: '0 1 * * 1,3,5'
  workflow_dispatch: # Cho phép bấm nút test thủ công bất kỳ lúc nào

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Email Dependencies
        run: |
          npm --prefix vnpis-web install nodemailer

      - name: Run Master Auto-Publish & Send Email
        env:
          NODE_PATH: ${{ github.workspace }}/vnpis-web/node_modules
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
        run: |
          node scripts/auto_publish_weekly.js
          echo "✅ Cloud Cron Execution Completed Successfully at $(date)"
